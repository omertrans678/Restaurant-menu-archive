function distance(a,b){let rad=Math.PI/180,da=(b[0]-a[0])*rad,db=(b[1]-a[1])*rad,v=Math.sin(da/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(db/2)**2;return 6371*2*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}
function mapLibraries(){if(!mapAssets){css('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css');mapAssets=script('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js').catch(e=>{mapAssets=null;throw e})}return mapAssets}
function renderMapView(){if(mapHost?.parentNode)mapHost.remove();$('#view').innerHTML=`<div class="pagehead"><div><p class="eyebrow">Yakınındaki seçenekler</p><h1>Harita</h1></div><small>Kuş uçuşu mesafe</small></div>${searchToolbar()}<div class="maptoolbar"><input id="address" type="search" placeholder="Adres veya bölge ara…" aria-label="Adres veya bölge"><button id="addressSearch">Adres ara</button><button id="myLocation">Konumumu kullan</button><button id="pickPoint" aria-pressed="${mapState.picking}">Nokta seç</button></div><div id="addressResults" class="mapresults"></div><div class="maptoolbar"><select id="mapArea" aria-label="Harita arama alanı">${options([['all','Tüm konumlar'],['bounds','Görünen alan'],['near','Seçilen noktaya yakın']],mapState.area)}</select><label class="check">En fazla <input type="number" id="mapRadius" min="0.1" step="0.5" value="${mapState.radius}" style="width:76px" ${!mapState.point?'disabled':''}> km</label><label class="check"><input id="mapAuto" type="checkbox" ${mapState.auto?'checked':''}>Otomatik ara</label><button id="areaSearch">Bu alanda ara</button>${mapState.point?'<button id="clearPoint">Noktayı temizle</button>':''}</div><p class="muted" id="pointStatus" style="font-size:12px;margin-bottom:10px">${mapState.point?'Referans: '+mapState.point.map(n=>n.toFixed(5)).join(', '):'Mesafe için konumunuzu kullanın veya haritadan bir nokta seçin.'}</p><div id="mapCount" class="meta"></div><div class="maplayout"><div id="mapSlot"></div><div id="mapList" class="maplist" aria-label="Haritadaki restoranlar"></div></div><p class="filehint">Mesafe kuş uçuşudur; teslimat yapılabildiğini göstermez. Adres araması: <a href="https://github.com/komoot/photon#demo-server" target="_blank" rel="noopener">Photon</a>, harita verisi: © OpenStreetMap katkıda bulunanlar. Adres yalnızca “Adres ara” ile hizmete gönderilir.</p><p id="mapStatus" class="notice" role="status"></p>`;if(!mapHost){mapHost=document.createElement('div');mapHost.id='map';mapHost.className='mapcanvas';mapHost.setAttribute('aria-label','Restoran konumları haritası')}$('#mapSlot').append(mapHost);icons();initMap()}
async function initMap(){try{if(!map){$('#mapStatus').textContent='Harita yükleniyor…';await mapLibraries();if(tab!=='map')return;map=L.map(mapHost,{zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView([39,35],5);if(location.protocol!=='file:'){L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> katkıda bulunanlar'}).on('tileerror',()=>{if($('#mapStatus'))$('#mapStatus').textContent='Harita zemini yüklenemedi. Konum işaretleri ve restoran listesi kullanılabilir.'}).addTo(map)}else $('#mapStatus').textContent='Harita zemini için HTTP önizlemesini kullanın. Dosya modunda konum işaretleri gösterilir.';cluster=L.layerGroup();map.addLayer(cluster);map.on('click',e=>{if(mapState.picking){setPoint([e.latlng.lat,e.latlng.lng]);mapState.picking=false;$('#pickPoint')?.setAttribute('aria-pressed','false')}});map.on('zoomend',()=>{if(tab==='map')drawMapDots()});map.on('moveend',()=>{if(tab==='map'&&mapState.auto&&mapState.area==='bounds'){mapState.bounds=map.getBounds();updateMapResults()}});if(location.protocol!=='file:')$('#mapStatus').textContent=''}map.invalidateSize();if(mapState.fit){let valid=restaurants.filter(r=>r.coords);if(valid.length)map.fitBounds(valid.map(r=>r.coords),{padding:[35,35],maxZoom:14});mapState.fit=false}updateMapResults();if(mapState.focus){let r=byR.get(mapState.focus);if(r?.coords){map.setView(r.coords,17);focusMarker(r.id)}mapState.focus=null}}catch{if($('#mapStatus'))$('#mapStatus').textContent='Harita kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edip Harita sekmesini yeniden açın. Diğer sekmeler çalışmaya devam eder.';updateMapResults()}}
function updateMapResults(){if(tab!=='map')return;let base=restaurants.filter(rMatch),missing=base.filter(r=>!r.coords).length;let list=base.filter(r=>r.coords);if(mapState.area==='bounds'&&mapState.bounds)list=list.filter(r=>mapState.bounds.contains(r.coords));if(mapState.area==='near'){if(!mapState.point)list=[];else list=list.filter(r=>distance(mapState.point,r.coords)<=mapState.radius)}list=sortedR(list);$('#mapCount').innerHTML=`<span><strong>${list.length}</strong> konum bulundu</span><button id="missingLocations" class="ghost" style="font-size:11px;padding:3px 8px">${missing} restoranın konumu yok →</button>`;$('#mapList').innerHTML=list.length?list.map(r=>`<article class="mapitem ${mapState.selected===r.id?'selected':''}" data-mapitem="${esc(r.id)}"><h3>${esc(r.name)}</h3><small>${esc(r.cuisines.join(' · '))}</small><p>☆ ${r.rating??'—'} · ${esc(r.raw.restoran_puani_degerlendirme_sayisi||'Bilinmiyor')} değerlendirme</p><p>${mode==='pickup'?'Gel Al':esc(r.raw.teslimat_suresi||'Süre bilinmiyor')} · Min. ${money(activeMin(r))}</p>${mapState.point?`<p>${distance(mapState.point,r.coords).toFixed(2)} km · kuş uçuşu</p>`:''}<button data-marker="${esc(r.id)}">Noktayı göster</button> <button data-detail="${esc(r.id)}">Restoran bilgisi</button></article>`).join(''):empty('Konum bulunamadı',mapState.area==='near'&&!mapState.point?'Önce bir referans noktası seçin.':'Arama alanını genişletin veya filtreleri temizleyin.');if(!cluster)return;cluster.clearLayers();markers.clear();for(let r of list){let marker=L.marker(r.coords,{icon:L.divIcon({className:'mapmarker'+(mapState.selected===r.id?' selected':''),iconSize:[28,28]}),title:r.name});let content=document.createElement('div');let title=document.createElement('strong');title.textContent=r.name;content.append(title);let info=document.createElement('p');info.textContent=`${r.cuisines.join(' · ')}\n☆ ${r.rating??'—'} · ${r.raw.restoran_puani_degerlendirme_sayisi||'Bilinmiyor'} değerlendirme\nMotor: ${r.raw.teslimat_suresi||'Bilinmiyor'} · ${r.raw.teslimat_ucreti||'Bilinmiyor'} · Min. ${money(r.min)}\n${r.pickup?'Gel Al mevcut · Min. 50 TL':'Gel Al yok'}${mapState.point?'\n'+distance(mapState.point,r.coords).toFixed(2)+' km kuş uçuşu':''}`;info.style.whiteSpace='pre-line';content.append(info);let button=document.createElement('button');button.textContent='Restoran bilgisi';button.onclick=()=>openDetail(r.id);content.append(button);let productsButton=document.createElement('button');productsButton.textContent='Ürünleri göster';productsButton.onclick=()=>{pf.restaurants=[r.id];pages.products=1;changeTab('products')};content.append(productsButton);marker.bindPopup(content);marker.on('click',()=>{mapState.selected=r.id;markers.forEach((m,id)=>m.setIcon(L.divIcon({className:'mapmarker'+(id===r.id?' selected':''),iconSize:[28,28]})));$$('[data-mapitem]').forEach(e=>e.classList.toggle('selected',e.dataset.mapitem===r.id));let item=$$('[data-mapitem]').find(e=>e.dataset.mapitem===r.id);if(item)$('#mapList').scrollTo({top:item.offsetTop-$('#mapList').offsetTop,behavior:'smooth'})});markers.set(r.id,marker)}drawMapDots()}
// Pair nearby points once; groups never grow beyond two restaurants.
let displayedDots=new Map();
function drawMapDots(){if(!map||!cluster)return;cluster.clearLayers();displayedDots.clear();let remaining=[...markers.entries()],used=new Set();for(let [id,marker] of remaining){if(used.has(id))continue;used.add(id);let at=map.latLngToLayerPoint(marker.getLatLng()),other=null,best=24;for(let [candidate,m] of remaining){if(used.has(candidate))continue;let d=at.distanceTo(map.latLngToLayerPoint(m.getLatLng()));if(d<best){best=d;other=[candidate,m]}}if(!other){cluster.addLayer(marker);displayedDots.set(id,{layer:marker,ids:[id]});continue}let [oid,om]=other;used.add(oid);let a=marker.getLatLng(),b=om.getLatLng();let pair=L.marker([(a.lat+b.lat)/2,(a.lng+b.lng)/2],{icon:L.divIcon({className:'map-pair',html:'<span></span><span></span>',iconSize:[36,28],iconAnchor:[18,14]}),title:marker.options.title+' / '+om.options.title});let popup=document.createElement('div');for(let item of [marker,om]){let section=document.createElement('section');section.style.cssText='padding:8px 0;border-bottom:1px solid var(--line)';section.append(item.getPopup().getContent());popup.append(section)}pair.bindPopup(popup);cluster.addLayer(pair);let group={layer:pair,ids:[id,oid]};displayedDots.set(id,group);displayedDots.set(oid,group)}}
function focusMarker(id){let marker=markers.get(id);if(!marker){toast('Bu restoran etkin harita filtrelerinde yer almıyor.');return}mapState.selected=id;map.stop();map.setView(marker.getLatLng(),Math.max(map.getZoom(),16),{animate:false});let group=displayedDots.get(id);if(group){cluster.removeLayer(group.layer);group.ids.forEach(key=>cluster.addLayer(markers.get(key)))}else cluster.addLayer(marker);marker.fire('click');marker.openPopup();$$('[data-mapitem]').forEach(e=>e.classList.toggle('selected',e.dataset.mapitem===id))}
function setPoint(point){if(!coords(point.join(',')))return;mapState.point=point;mapState.area='near';if(tab==='map'&&$('#sort')&&!$('#sort option[value=distance]')){let option=document.createElement('option');option.value='distance';option.textContent='Mesafe: en yakın';$('#sort').append(option)}if(pointMarker)pointMarker.remove();if(map)pointMarker=L.circleMarker(point,{radius:9,color:'#a56708',weight:3,fillColor:'#ffdc81',fillOpacity:1}).addTo(map).bindTooltip('Mesafe referans noktası');if($('#mapArea'))$('#mapArea').value='near';if($('#mapRadius'))$('#mapRadius').disabled=false;if(!$('#clearPoint')&&$('#pointStatus'))$('#pointStatus').insertAdjacentHTML('afterend','<button id="clearPoint" style="margin-bottom:10px">Noktayı temizle</button>');if($('#pointStatus'))$('#pointStatus').textContent='Referans: '+point.map(n=>n.toFixed(5)).join(', ')+' · Kuş uçuşu mesafe';updateMapResults()}
function locate(){if(!navigator.geolocation){toast('Bu tarayıcı konum özelliğini desteklemiyor.');return}navigator.geolocation.getCurrentPosition(p=>{setPoint([p.coords.latitude,p.coords.longitude]);map?.setView(mapState.point,14)},()=>toast('Konum alınamadı. Adres arayabilir veya haritadan nokta seçebilirsiniz.'),{timeout:12000,maximumAge:60000})}
async function addressSearch(){let q=$('#address')?.value.trim();if(!q||q.length<3){toast('En az 3 karakterlik adres veya bölge yazın.');return}if(Date.now()-mapState.lastAddress<1500){toast('Yeni arama için kısa bir süre bekleyin.');return}mapState.lastAddress=Date.now();let button=$('#addressSearch');button.disabled=true;try{let data=mapState.cache.get(q);if(!data){let response=await fetch('https://photon.komoot.io/api/?limit=5&q='+encodeURIComponent(q),{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error();data=await response.json();mapState.cache.set(q,data)}mapState.addresses=(data.features||[]).filter(a=>a.geometry?.type==='Point'&&coords(a.geometry.coordinates[1]+','+a.geometry.coordinates[0]));if(!$('#addressResults'))return;$('#addressResults').innerHTML=mapState.addresses.length?mapState.addresses.map((a,i)=>`<button data-address="${i}">${esc([...new Set([a.properties.name,a.properties.street,a.properties.district,a.properties.city,a.properties.country].filter(Boolean))].join(', '))}</button>`).join(''):'<small>Adres bulunamadı. Daha genel bir bölge adı deneyin.</small>'}catch{toast('Adres hizmetine ulaşılamadı. Haritadan nokta seçebilirsiniz.')}finally{button.disabled=false}}
render();
if(location.protocol==='file:'){loading=false;$('#message').textContent='Yerel dosya modu: veri.json dosyasını seçin veya sayfaya sürükleyin.';renderView()}else fetch('./veri.json').then(r=>{if(!r.ok)throw Error('Dosya okunamadı (HTTP '+r.status+').');return r.text()}).then(t=>{if(loadToken===0)return load(t,'veri.json')}).catch(e=>{if(loadToken>0)return;loading=false;$('#message').textContent=e.message+' JSON seç düğmesini kullanabilirsiniz.';renderView()});
</script>
