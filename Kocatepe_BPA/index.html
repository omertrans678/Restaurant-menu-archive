document.addEventListener('click',e=>{let button=e.target.closest('[data-pill]');if(button){let key=button.dataset.pill;f[key]=!f[key];if(key==='exact100')f.motorMinimums=[];if(key==='free')f.deliveryFees=[];if(key==='free'&&f.free)mode='motor';page=1;render();$(`[data-pill="${key}"]`)?.focus({preventScroll:true})}if(e.target.closest('#neighborhoodButton')){let menu=$('#neighborhoodMenu'),rect=$('#neighborhoodButton').getBoundingClientRect();menu.style.top=(rect.bottom+8)+'px';menu.style.left=Math.max(12,Math.min(rect.left,innerWidth-312))+'px'}});
labels.badges='Restoran rozeti';labels.motorMinimums='Motor minimumu';labels.deliveryFees='Teslimat ücreti';labels.exact100='100 TL';labels.neighborhoods='Mahalle';

render();
if(location.protocol==='file:'){loading=false;$('#message').textContent='Otomatik veri yüklemek için HTTP önizlemesini kullanın. JSON dosyasını sayfaya sürükleyerek de açabilirsiniz.';renderView()}else loadLatestDataset();
</script>
