<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barkod Listesi</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:0;background:#f5f5f5;color:#222}main{max-width:760px;margin:24px auto;padding:20px;background:white;border-radius:8px}h1{font-size:24px;margin-top:0}button,input{font:inherit;padding:12px;border:1px solid #ccc;border-radius:5px}button{cursor:pointer;background:#eee}button.primary{background:#176b43;color:white;border-color:#176b43}button:disabled{opacity:.5;cursor:default}.actions,form{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input{flex:1;min-width:160px}#reader{max-width:500px;margin:auto}#status{min-height:24px;color:#222}#status.success{color:#176b43}#scan-area{position:relative;max-width:500px;margin:auto}#qr-shaded-region{display:none!important}#scan-frame{display:none;position:absolute;pointer-events:none;top:50%;left:5%;width:90%;height:min(60%,160px);transform:translateY(-50%);border:2px solid #ddd;border-radius:6px}.scanning #scan-frame{display:block}.scanning.scan-success #scan-frame{border:4px solid #20c35a}#scan-check{display:none;position:absolute;top:8px;right:8px;background:#20c35a;color:#fff;border-radius:50%;padding:4px 10px;font-size:28px}.scan-success #scan-check{display:block}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid #ddd}td:first-child{overflow-wrap:anywhere}td button{padding:5px 10px}.note{color:#666;font-size:14px}.table{overflow-x:auto}@media(max-width:600px){main{margin:0;border-radius:0;padding:16px}}

body{height:100dvh;overflow:hidden}main{height:100dvh;max-width:760px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}h1{font-size:20px;margin:0}.actions,form{margin:0;gap:6px}button,input{padding:8px 10px}#scan-area{width:min(100%,calc(28svh * 1.777));flex-shrink:0}#reader{width:100%}#reader video{display:block}#status{margin:0;font-size:14px;min-height:20px;max-height:40px;overflow:auto}#count{margin:0;font-size:14px}.table{flex:1;min-height:80px;overflow:auto;border:1px solid #ddd;border-radius:5px}thead{position:sticky;top:0;background:#fff;z-index:1}td,th{padding:8px 6px}#rows tr:first-child{font-weight:600}details{flex-shrink:0;font-size:14px}details p{margin:6px 0}details form{margin-top:6px}summary{cursor:pointer;color:#555}#camera-actions{flex-shrink:0}.table table{font-size:15px}@media(min-width:700px){main{padding:16px}#scan-area{width:min(100%,calc(30svh * 1.777))}}@media(max-height:500px){#scan-area{width:min(100%,calc(22svh * 1.777))}main{gap:4px}td,th{padding:5px}}
</style>
<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script defer src="app.js?v=5"></script>
</head>
<body><main>
<h1>Barkod Listesi</h1>
<div class="actions" id="camera-actions"><button id="camera" class="primary">Kamerayı aç</button><button id="stop" hidden>Kamerayı kapat</button><button id="download" class="primary" disabled>Excel indir</button><button id="clear" disabled>Temizle</button></div>
<div id="scan-area"><div id="reader"></div><div id="scan-frame"><span id="scan-check" aria-hidden="true">✓</span></div></div>
<p id="status" role="status" aria-live="polite"></p>
<p id="count">Liste boş.</p>
<div class="table" id="list-area" tabindex="0" aria-label="Barkod listesi"><table><thead><tr><th>Barkod</th><th>Adet</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table></div>
<details><summary>Elle ekle / Kullanım bilgisi</summary>
<form id="form"><input id="barcode" aria-label="Barkod" placeholder="10 karakterli barkod" pattern="[A-Za-z0-9]{10}" title="10 harf veya rakam içeren barkodu girin" autocapitalize="characters" autocomplete="off" required minlength="10" maxlength="10"><button class="primary">Ekle</button></form>
<p class="note">10 harf veya rakam içeren kısa barkodu yatay okutun. QR ve uzun kargo barkodu kabul edilmez. Tekrar eklemek için 1 saniye kameradan uzaklaştırın. Liste bu tarayıcıda saklanır.</p>
</details>
</main></body></html>
