<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barkod Listesi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:16px system-ui,sans-serif;color:#222;background:#f5f5f5}body{overflow:hidden}main{height:100dvh;max-width:760px;margin:auto;background:white;padding:10px;display:grid;grid-template-rows:auto auto minmax(100px,28dvh) auto auto minmax(90px,1fr) auto;gap:7px;overflow:hidden}h1{font-size:20px;margin:0}.actions{display:flex;gap:5px;flex-wrap:wrap}button,input{font:inherit;padding:8px;border:1px solid #ccc;border-radius:5px}button{cursor:pointer}.primary{background:#176b43;color:white;border-color:#176b43}button:disabled{opacity:.5}#scan-area{position:relative;min-height:0;overflow:hidden;background:#222;border-radius:6px;width:100%;height:100%}#reader{width:100%;height:100%;min-height:0;overflow:hidden}#video{display:block;width:100%!important;height:100%!important;max-height:100%!important;object-fit:contain}#scan-frame{display:none;position:absolute;inset:8px;border:2px solid #ddd;border-radius:5px;pointer-events:none}.scanning #scan-frame{display:block}.scan-success #scan-frame{border:4px solid #20c35a}#scan-check{display:none;position:absolute;top:8px;right:8px;background:#20c35a;color:white;border-radius:50%;padding:4px 10px;font-size:24px}.scan-success #scan-check{display:block}#resolution{position:absolute;bottom:8px;left:8px;color:white;background:#0009;padding:2px 5px;font-size:12px}#status,#count{margin:0;font-size:14px;min-height:18px}#status{max-height:36px;overflow:auto}#status.success{color:#176b43}.table{min-height:0;overflow:auto;border:1px solid #ddd;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:15px}thead{position:sticky;top:0;background:white;z-index:1}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid #ddd}td button{padding:4px 8px}#rows tr:first-child{font-weight:600}details{font-size:13px;max-height:25dvh;overflow:auto}summary{cursor:pointer}form{display:flex;gap:5px;margin-top:7px}input{min-width:0;flex:1}.note{color:#666;margin:7px 0}@media(max-height:500px){main{grid-template-rows:auto auto minmax(65px,22dvh) auto auto minmax(60px,1fr) auto;gap:3px}h1{font-size:16px}button{padding:5px}td,th{padding:5px}}
</style>
<script defer src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script defer src="app.js?v=7"></script>
</head>
<body><main>
<h1>Barkod Listesi</h1>
<div class="actions" id="camera-actions"><button id="camera" class="primary">Kamerayı aç</button><button id="stop" hidden>Kamerayı kapat</button><button id="download" class="primary" disabled>Excel indir</button><button id="clear" disabled>Temizle</button></div>
<div id="scan-area"><div id="reader"><video id="video" autoplay muted playsinline></video></div><div id="scan-frame"><span id="scan-check" aria-hidden="true">✓</span></div><span id="resolution"></span></div>
<p id="status" role="status" aria-live="polite"></p>
<p id="count">Liste boş.</p>
<div class="table" id="list-area" tabindex="0" aria-label="Barkod listesi"><table><thead><tr><th>Barkod</th><th>Adet</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table></div>
<details><summary>Elle ekle / Kullanım bilgisi</summary>
<form id="form"><input id="barcode" aria-label="Barkod" placeholder="10 karakterli barkod" pattern="[A-Za-z0-9]{10}" title="10 harf veya rakam içeren barkodu girin" autocapitalize="characters" autocomplete="off" required minlength="10" maxlength="10"><button class="primary">Ekle</button></form>
<p class="note">10 harf veya rakam içeren kısa barkodu yatay veya dikey okutun. QR ve uzun kargo barkodu kabul edilmez. Bekleme yok; aynı barkodu tekrar eklemek için kameradan çıkarıp yeniden gösterin. Liste bu tarayıcıda saklanır.</p>
</details>
</main></body></html>
