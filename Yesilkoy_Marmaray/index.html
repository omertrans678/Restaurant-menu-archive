setInterval(()=>{$$('[data-status-r]').forEach(el=>{let r=byR.get(el.dataset.statusR);if(r)el.outerHTML=statusHTML(r)})},60000);


const categoryLimits=new Map(),categoryItems=new Map(),categoryOpen=new Map();let detailScrollQueued=false,pendingQuickPickup=false;
function detailCategories(r){let list=sortedP(r.products.filter(p=>pMatch(p,df)),df),buckets=new Map();for(let p of list){if(!buckets.has(p.cat))buckets.set(p.cat,[]);buckets.get(p.cat).push(p)}return {list,groups:[...new Set(r.products.map(p=>p.cat))].filter(c=>buckets.has(c)).map(cat=>({cat,items:buckets.get(cat)}))}}
function categoryContent(key){let items=categoryItems.get(key)||[],limit=categoryLimits.get(key)||12;return `<div class="category-grid">${items.slice(0,limit).map(productCard).join('')}</div>${items.length>limit?`<div class="load-products"><button data-category-more="${esc(key)}">${Math.min(items.length-limit,24)} ürün daha göster (${limit} / ${items.length})</button></div>`:''}`}
function renderRestaurantDetail(){let r=byR.get(selectedR);if(!r)return `<div class="pagehead"><h1>Restoran Bilgisi</h1></div><div class="empty">${icon('store')}<h2>Bir restoran seçin</h2><p>Menü ve restoran bilgileri burada gösterilir.</p><button data-tab="restaurants" class="primary">Restoranlara git</button></div>`;let {list,groups}=detailCategories(r);let sections=groups.map((g,i)=>{let key=r.id+'|'+g.cat;categoryItems.set(key,g.items);let open=categoryOpen.get(key)!==false;return `<section class="menu-category" id="menu-category-${i}" data-menu-category="${esc(g.cat)}"><header class="category-sticky-heading"><button data-category-toggle="${esc(key)}" aria-expanded="${open}" aria-controls="menu-body-${i}"><span class="category-label"><strong>${esc(g.cat)}</strong><span class="category-count">${g.items.length} Ürün</span></span>${icon('chevron-down')}</button></header><div class="accordion-panel ${open?'open':''}" id="menu-body-${i}" ${open?'':'inert'}><div class="accordion-clip"><div data-category-content="${esc(key)}">${categoryContent(key)}</div></div></div></section>`}).join('');return `<div class="pagehead"><button id="back">${icon('arrow-left')}Sonuçlara dön</button></div><div class="sticky-restaurant"><h2>${esc(r.name)}</h2>${scoreHTML(r)}</div><section class="restaurant-parent detail-parent">${restaurantSummary(r,true)}<div class="parent-actions">${restaurantActions(r)}</div><details class="payment-details"><summary>Ödeme yöntemleri (${r.payments.length})</summary><div class="payments">${['Online','Kapıda'].map(ch=>`<div><strong>${ch}</strong><ul>${r.payments.filter(s=>(norm(s).startsWith('kapıda')?'Kapıda':'Online')===ch).map(s=>`<li>${esc(s)}</li>`).join('')||'<li>Bilgi yok</li>'}</ul></div>`).join('')}</div></details></section><div class="detail-service">${serviceControls()}</div>${searchToolbar(true)}${groups.length?`<nav class="categorynav category-anchors" aria-label="Menü kategorilerine atla"><span class="category-indicator" aria-hidden="true"></span>${groups.map((g,i)=>`<button data-category="${esc(g.cat)}" class="${i===0?'active':''}">${esc(g.cat)} <small>(${g.items.length})</small></button>`).join('')}</nav>`:''}${resultsHeader(list.length,'ürün')}<div id="detailResults">${groups.length?sections:empty('Eşleşen ürün bulunamadı','Arama veya ürün filtrelerini gevşetin. Eşleşmeyen kategoriler gizlendi.')}</div><button id="allRestaurant">Bu restoranın tüm ürünleri</button>`}
function toggleCategory(key,button){let panel=document.getElementById(button.getAttribute('aria-controls')),open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));panel.classList.toggle('open',open);panel.inert=!open;categoryOpen.set(key,open)}
function moreCategory(key,button){categoryLimits.set(key,(categoryLimits.get(key)||12)+24);button.closest('[data-category-content]').innerHTML=categoryContent(key);icons()}
function updateDetailStickySize(){let header=$('.sticky-restaurant');if(header)document.documentElement.style.setProperty('--detail-sticky-height',Math.ceil(header.getBoundingClientRect().height+7)+'px')}
function setActiveCategory(cat){$$('.categorynav button').forEach(button=>{let active=button.dataset.category===cat;button.classList.toggle('active',active);button.setAttribute('aria-current',active?'true':'false')});positionCategoryIndicator()}
function updateActiveCategory(){if(tab!=='detail')return;let sections=$$('[data-menu-category]');if(!sections.length)return;let threshold=($('.sticky-restaurant')?.getBoundingClientRect().bottom||60)+25,active=sections[0];for(let section of sections){if(section.getBoundingClientRect().top<=threshold)active=section;else break}setActiveCategory(active.dataset.menuCategory)}
addEventListener('scroll',()=>{if(detailScrollQueued||tab!=='detail')return;detailScrollQueued=true;requestAnimationFrame(()=>{detailScrollQueued=false;updateActiveCategory()})},{passive:true});addEventListener('resize',()=>{updateDetailStickySize();updateActiveCategory()});
function quickFilterChips(){return `<div class="quick-filters" aria-label="Hızlı filtreler"><button data-quick="value" aria-pressed="${f.open&&f.free&&f.under100&&+f.rating>=4&&mode==='motor'}" title="Saatlere göre açık, kesin ücretsiz teslimat, minimum 100 TL altında, puanı en az 4; yüksek puana göre sıralanır">🟢 Açık · 🛵 Ücretsiz · 💰 Min. &lt; 100 TL · ⭐ Yüksek puan</button><button data-quick="pickup" aria-pressed="${f.open&&mode==='pickup'&&sortR==='distance'}" title="Saatlere göre açık, Gel Al mevcut; ev konumuna yakınlığa göre sıralanır">🟢 Açık · 🛍️ Gel Al · 📍 En yakınlar</button></div>`}
function applyQuickFilter(kind){if(kind==='pickup'&&!mapState.point){pendingQuickPickup=true;mapControlsOpen=true;changeTab('map');$('.map-controls').open=true;mapState.picking=true;$('#pickPoint')?.setAttribute('aria-pressed','true');toast('En yakınlar için haritada ev konumunuzu seçin.');return}let query=f.q;f={...defaults(),q:query,open:true};mode=kind==='pickup'?'pickup':'motor';if(kind==='value'){f.free=true;f.under100=true;f.rating='4';sortR='rating';sortP='rating'}else{f.pickup=true;sortR='distance';sortP='distance'}page=1;render()}
matchMedia('(max-width:800px)').addEventListener('change',e=>{mapControlsOpen=!e.matches;let controls=$('.map-controls');if(controls)controls.open=mapControlsOpen;requestAnimationFrame(()=>map?.invalidateSize())});
// CARTO vector Dark Matter is used so the raster service's API-key watermark is not bypassed.
async function syncMapTheme(){if(!map||location.protocol==='file:')return;const generation=++basemapGeneration,dark=document.documentElement.dataset.theme==='dark';if(!dark){if(darkLayer&&map.hasLayer(darkLayer))map.removeLayer(darkLayer);if(lightLayer&&!map.hasLayer(lightLayer))lightLayer.addTo(map);mapHost.classList.remove('map-dark-fallback');return}try{if(!darkAssets){css('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css');darkAssets=script('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js').then(()=>script('https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js')).catch(e=>{darkAssets=null;throw e})}await darkAssets;if(generation!==basemapGeneration||document.documentElement.dataset.theme!=='dark')return;if(!darkLayer){darkLayer=L.maplibreGL({style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attribution/">CARTO</a>'});darkLayer.addTo(map);darkLayer.getMaplibreMap().on('error',()=>{if($('#mapStatus'))$('#mapStatus').textContent='Koyu harita verisinin bir bölümü yüklenemedi. İşaretler ve liste kullanılabilir.'})}else if(!map.hasLayer(darkLayer))darkLayer.addTo(map);if(lightLayer&&map.hasLayer(lightLayer))map.removeLayer(lightLayer);mapHost.classList.remove('map-dark-fallback');darkLayer.getMaplibreMap().resize()}catch{mapHost.classList.add('map-dark-fallback');if(lightLayer&&!map.hasLayer(lightLayer))lightLayer.addTo(map);if($('#mapStatus'))$('#mapStatus').textContent='Koyu harita katmanı yüklenemedi; alternatif harita görünümü kullanılıyor.'}}

render();
if(location.protocol==='file:'){loading=false;$('#message').textContent='Yerel dosya modu: veri.json dosyasını seçin veya sayfaya sürükleyin.';renderView()}else fetch('./veri.json').then(r=>{if(!r.ok)throw Error('Dosya okunamadı (HTTP '+r.status+').');return r.text()}).then(t=>{if(loadToken===0)return load(t,'veri.json')}).catch(e=>{if(loadToken>0)return;loading=false;$('#message').textContent=e.message+' JSON seç düğmesini kullanabilirsiniz.';renderView()});
</script>
</body>
</html>
